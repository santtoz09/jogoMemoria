<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>

    <link rel="stylesheet" href="./css/style.css">
    
</head>

<body>


    
    <section class="quiz">
        <h2 class="quiz-title">QUIZ</h2>
        <p class="quiz-question">pergunta aqui lorem ipsum dolor sit amet</p>
        <div class="quiz-controls">
            <div id="quiz-choices" class="quiz-choices"></div>
            <input type="text" id="quiz-answer" placeholder="Digite sua resposta" hidden>
            <button id="quiz-submit">Enviar</button>
            <button id="quiz-next" hidden>Próxima</button>
            <button id="quiz-restart" hidden>Reiniciar</button>
            <div id="quiz-feedback" aria-live="polite"></div>
            <div id="quiz-score" class="quiz-score"></div>
        </div>
    </section>

    <section class="jogo-da-memoria">
        <h2 class="memoria-title">Jogo da Memória</h2>
        <div class="memoria-grid">


            <div class="memoria-card" data-card="1">
                <img src="caminho/para/imagem1.jpg" alt="Imagem 1">
                <p>Nome</p>
            </div>


            <div class="memoria-card" data-card="2">

                <p>Nome</p>
            </div>

                <p>Nome</p>
            </div>

                <p>Nome</p>
            </div>


            <div class="memoria-card" data-card="5">
                <img src="caminho/para/imagem5.jpg" alt="Imagem 5">
                <p>Nome</p>
            </div>


            <div class="memoria-card" data-card="6">
                <img src="caminho/para/imagem6.jpg" alt="Imagem 6">
                <p>Nome</p>
            </div>


            <div class="memoria-card" data-card="7">
                <img src="caminho/para/imagem7.jpg" alt="Imagem 7">
                <p>Nome</p>
            </div>


            <div class="memoria-card" data-card="8">
                <img src="caminho/para/imagem8.jpg" alt="Imagem 8">

    <script src="./js/index.js"></script>

</html>
